<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>头条新闻 · 按日期检索</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --text: #e7ecf3;
            --muted: #8b9cb3;
            --accent: #3d8bfd;
            --error: #f87171;
            --divider: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            width: 100%;
            max-width: 860px;
            background: var(--card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
        }
        .topbar h1 { margin: 0; }
        .sub-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(61, 139, 253, 0.35);
            background: rgba(61, 139, 253, 0.12);
            color: #cfe1ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .sub-btn:hover { filter: brightness(1.08); }
        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0 0 0.35rem;
            letter-spacing: -0.02em;
        }
        .hint {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.25);
            color: var(--text);
            font-size: 1rem;
        }
        input[type="text"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(61, 139, 253, 0.2);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 0.9rem;
            align-items: end;
        }
        @media (max-width: 720px) {
            .grid { grid-template-columns: 1fr; }
        }
        button {
            width: 100%;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(180deg, #4d9bff, var(--accent));
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.08); }
        button:active { transform: scale(0.99); }
        .err {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: rgba(248, 113, 113, 0.12);
            color: var(--error);
            font-size: 0.9rem;
        }
        .list {
            list-style: none;
            padding: 0;
            margin: 1.25rem 0 0;
            border-top: 1px solid var(--divider);
        }
        .item {
            padding: 1rem 0;
            border-bottom: 1px solid var(--divider);
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 0.9rem;
        }
        .time {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            font-size: 0.95rem;
            padding-top: 0.15rem;
        }
        .title a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            line-height: 1.35;
        }
        .title a:hover { color: #cfe1ff; text-decoration: underline; }
        .desc {
            margin: 0.35rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .empty {
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 12px;
            background: rgba(61, 139, 253, 0.08);
            border: 1px solid rgba(61, 139, 253, 0.18);
            color: #cfe1ff;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="topbar">
        <h1>头条新闻 · 按日期查看</h1>
        <a class="sub-btn" th:href="@{/subscribe}">订阅邮箱</a>
    </div>
    <p class="hint">数据源：中新网「即时新闻」RSS。选择日期后会自动展示当天的新闻条目；可选填关键词进行筛选。</p>
    <form id="searchForm" method="get" th:action="@{/}">
        <div class="grid">
            <div>
                <label for="date">日期</label>
                <input id="date" name="date" type="date" th:value="${date}"/>
            </div>
            <div>
                <label for="q">关键词（可选）</label>
                <input id="q" name="q" type="text" placeholder="例如：科技 / 经济 / 体育" th:value="${q}"/>
            </div>
            <div>
                <button type="submit">查询</button>
            </div>
        </div>
    </form>

    <div class="err" th:if="${error != null}" th:text="${error}"></div>
    <div class="empty" th:if="${emptyHint != null}" th:text="${emptyHint}"></div>

    <ul class="list" th:if="${headlines != null and !headlines.isEmpty()}">
        <li class="item" th:each="h : ${headlines}">
            <div class="time" th:text="${h.time}">00:00</div>
            <div>
                <div class="title">
                    <a th:href="${h.link}" th:text="${h.title}" target="_blank" rel="noopener noreferrer">标题</a>
                </div>
                <p class="desc" th:if="${h.description != null and !#strings.isEmpty(h.description)}"
                   th:text="${h.description}"></p>
            </div>
        </li>
    </ul>
</div>

<script>
  (function () {
    const form = document.getElementById('searchForm');
    const date = document.getElementById('date');
    if (date) {
      date.addEventListener('change', function () {
        form.submit();
      });
    }
  })();
</script>
</body>
</html>
