<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>头条新闻 · 按日期检索</title>
    <style>
        :root {
            --bg1: #eef4ff;
            --bg2: #f7f9fc;
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(15, 23, 42, 0.10);
            --shadow: 0 24px 60px rgba(2, 6, 23, 0.10);
            --primary: #16a34a;
            --primary2: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
            color: var(--text);
            background:
                    radial-gradient(1200px 600px at 18% 28%, #dbeafe 0%, transparent 60%),
                    radial-gradient(900px 500px at 75% 15%, #e9d5ff 0%, transparent 55%),
                    linear-gradient(180deg, var(--bg1), var(--bg2));
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: inherit;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(180deg, #22c55e, #16a34a);
            box-shadow: 0 10px 18px rgba(22, 163, 74, 0.25);
            position: relative;
        }

        .brand-badge:after {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.22);
        }

        .nav {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .nav a {
            color: var(--muted);
            text-decoration: none;
            padding: 0.5rem 0.65rem;
            border-radius: 10px;
        }

        .nav a:hover {
            background: rgba(2, 6, 23, 0.05);
            color: #0f172a;
        }

        .subscribe-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(22, 163, 74, 0.25);
            background: rgba(22, 163, 74, 0.10);
            color: #166534;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .subscribe-btn:hover { filter: brightness(1.04); }

        .main {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1.25rem 1.25rem 2.25rem;
        }

        .layout {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
            align-items: start;
        }

        .hero {
            padding-top: 0.25rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.15rem;
            line-height: 1.15;
            margin: 0 0 0.75rem;
            letter-spacing: -0.03em;
        }

        .hint {
            font-size: 0.98rem;
            color: var(--muted);
            line-height: 1.5;
            margin: 0 0 1.25rem;
        }

        .bullets {
            display: grid;
            gap: 0.7rem;
            margin-top: 1.1rem;
            color: #334155;
            font-size: 0.95rem;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .bullet {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.18);
            border: 1px solid rgba(34, 197, 94, 0.25);
            margin-top: 0.15rem;
            flex: 0 0 auto;
        }

        .panel {
            background: rgba(255, 255, 255, 0.80);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            padding: 1.25rem;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .panel h2 {
            margin: 0 0 0.9rem;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
        }

        .panel-sub {
            margin-top: -0.55rem;
            margin-bottom: 1rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #475569;
            margin-bottom: 0.4rem;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(15, 23, 42, 0.14);
            background: rgba(255, 255, 255, 0.92);
            color: #0f172a;
            font-size: 1rem;
        }

        input[type="text"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: rgba(34, 197, 94, 0.7);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 0.9rem;
            align-items: end;
        }

        @media (max-width: 980px) {
            .grid { grid-template-columns: 1fr; }
        }

        .btn {
            width: 100%;
            padding: 0.8rem 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(180deg, var(--primary2), var(--primary));
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover { filter: brightness(1.03); }
        .btn:active { transform: scale(0.99); }

        .err {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.08);
            color: #b91c1c;
            font-size: 0.9rem;
        }

        .list {
            list-style: none;
            padding: 0;
            margin: 1.25rem 0 0;
            border-top: 1px solid rgba(15, 23, 42, 0.10);
        }

        .item {
            padding: 1rem 0;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 0.9rem;
        }

        .time {
            font-variant-numeric: tabular-nums;
            color: #64748b;
            font-size: 0.95rem;
            padding-top: 0.15rem;
        }

        .title a {
            color: #0f172a;
            text-decoration: none;
            font-weight: 700;
            line-height: 1.35;
        }

        .title a:hover { text-decoration: underline; }

        .desc {
            margin: 0.35rem 0 0;
            color: #475569;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .empty {
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 12px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.18);
            color: #166534;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="page">
    <header class="header">
        <a class="brand" th:href="@{/}">
            <span class="brand-badge" aria-hidden="true"></span>
            <span>热点速递</span>
        </a>
        <nav class="nav">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/subscribe}" class="subscribe-btn">订阅邮箱</a>
        </nav>
    </header>

    <main class="main">
        <div class="layout">
            <section class="hero">
                <h1>每天 9 点，自动把昨日十大热点发到邮箱</h1>
                <p class="hint">数据源：中新网「即时新闻」RSS。你也可以在右侧按日期与关键词查看当天新闻。</p>

                <div class="bullets">
                    <div class="bullet"><span class="dot" aria-hidden="true"></span><div>昨日新闻按时间倒序，自动取前 <strong>10</strong> 条</div></div>
                    <div class="bullet"><span class="dot" aria-hidden="true"></span><div>支持关键词筛选（例如：科技 / 经济 / 体育）</div></div>
                    <div class="bullet"><span class="dot" aria-hidden="true"></span><div>右上角可一键进入“订阅邮箱”页面</div></div>
                </div>
            </section>

            <section class="panel">
                <h2>按日期查看</h2>
                <div class="panel-sub">选择日期后会自动刷新；关键词可选填。</div>

                <form id="searchForm" method="get" th:action="@{/}">
                    <div class="grid">
                        <div>
                            <label for="date">日期</label>
                            <input id="date" name="date" type="date" th:value="${date}"/>
                        </div>
                        <div>
                            <label for="q">关键词（可选）</label>
                            <input id="q" name="q" type="text" placeholder="例如：科技 / 经济 / 体育" th:value="${q}"/>
                        </div>
                        <div>
                            <button class="btn" type="submit">查询</button>
                        </div>
                    </div>
                </form>

                <div class="err" th:if="${error != null}" th:text="${error}"></div>
                <div class="empty" th:if="${emptyHint != null}" th:text="${emptyHint}"></div>

                <ul class="list" th:if="${headlines != null and !headlines.isEmpty()}">
                    <li class="item" th:each="h : ${headlines}">
                        <div class="time" th:text="${h.time}">00:00</div>
                        <div>
                            <div class="title">
                                <a th:href="${h.link}" th:text="${h.title}" target="_blank" rel="noopener noreferrer">标题</a>
                            </div>
                            <p class="desc" th:if="${h.description != null and !#strings.isEmpty(h.description)}"
                               th:text="${h.description}"></p>
                        </div>
                    </li>
                </ul>
            </section>
        </div>
    </main>
</div>

<script>
  (function () {
    const form = document.getElementById('searchForm');
    const date = document.getElementById('date');
    if (date) {
      date.addEventListener('change', function () {
        form.submit();
      });
    }
  })();
</script>
</body>
</html>
