spring.application.name=AutoTxt
server.port=8080
spring.thymeleaf.cache=false

# --- Auto email (Headlines) ---
# Turn on: AUTOTXT_MAIL_ENABLED=true
autotxt.mail.enabled=${AUTOTXT_MAIL_ENABLED:false}
# Recipients, separated by comma/space/semicolon
autotxt.mail.to=${AUTOTXT_MAIL_TO:}
# Optional: explicit From (some SMTP providers require it)
autotxt.mail.from=${AUTOTXT_MAIL_FROM:}
# Note: .properties is ISO-8859-1. Use \\uXXXX escapes for non-ASCII to avoid garbled text.
autotxt.mail.subjectPrefix=${AUTOTXT_MAIL_SUBJECT_PREFIX:\u5934\u6761\u65b0\u95fb}
# Optional keyword filter for daily email
autotxt.mail.keyword=${AUTOTXT_MAIL_KEYWORD:}
# Daily schedule (Spring cron with seconds). Default: 09:00 every day.
autotxt.mail.cron=${AUTOTXT_MAIL_CRON:0 0 9 * * *}
autotxt.mail.zone=${AUTOTXT_MAIL_ZONE:Asia/Shanghai}
# Daily limit. Default: 10 items.
autotxt.mail.limit=${AUTOTXT_MAIL_LIMIT:10}

# --- Subscribers ---
# One email per line, UTF-8. Will be auto-created if missing.
autotxt.subscribers.file=${AUTOTXT_SUBSCRIBERS_FILE:data/subscribers.txt}

# --- SMTP (Spring Mail) ---
# Example (QQ mail): smtp.qq.com / port 465 / SSL; use app password as spring.mail.password
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.default-encoding=${SPRING_MAIL_DEFAULT_ENCODING:UTF-8}
spring.mail.properties.mail.smtp.auth=true
# Enable one of these depending on your provider:
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:true}
# spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:}
