spring.application.name=AutoTxt
server.port=8080
spring.thymeleaf.cache=false

# --- Auto email (Headlines) ---
# Turn on: autotxt.mail.enabled=true
autotxt.mail.enabled=false
# Recipients, separated by comma/space/semicolon
autotxt.mail.to=
# Optional: explicit From (some SMTP providers require it)
autotxt.mail.from=
autotxt.mail.subjectPrefix=头条新闻
# Optional keyword filter for daily email
autotxt.mail.keyword=
# Daily schedule (Spring cron with seconds). Default: 08:00 every day.
autotxt.mail.cron=0 0 8 * * *
autotxt.mail.zone=Asia/Shanghai

# --- SMTP (Spring Mail) ---
# Example (QQ mail): smtp.qq.com / port 465 / SSL; use app password as spring.mail.password
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
# Enable one of these depending on your provider:
spring.mail.properties.mail.smtp.ssl.enable=true
# spring.mail.properties.mail.smtp.starttls.enable=true
